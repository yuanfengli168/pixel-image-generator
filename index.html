<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Style Image Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg: #0a0a1a;
    --panel: #10102a;
    --border: #3a3aff;
    --accent: #ff2d78;
    --accent2: #00ffcc;
    --text: #e0e0ff;
    --dim: #5555aa;
    --btn-bg: #1a1a3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
    background-image:
      linear-gradient(rgba(58,58,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,58,255,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* Scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent, transparent 2px,
      rgba(0,0,0,0.13) 2px, rgba(0,0,0,0.13) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header h1 {
    font-size: clamp(13px, 2.8vw, 20px);
    color: var(--accent2);
    text-shadow: 0 0 8px var(--accent2), 0 0 24px var(--accent2);
    line-height: 1.7;
    letter-spacing: 2px;
    animation: flicker 5s infinite;
  }

  header p {
    margin-top: 12px;
    font-size: 7px;
    color: var(--dim);
    letter-spacing: 1px;
  }

  @keyframes flicker {
    0%,93%,100% { opacity:1; }
    94% { opacity:.6; }
    96% { opacity:1; }
    98% { opacity:.5; }
  }

  .card {
    width: 100%;
    max-width: 680px;
    background: var(--panel);
    border: 2px solid var(--border);
    box-shadow: 0 0 16px rgba(58,58,255,.4), inset 0 0 32px rgba(58,58,255,.04);
    padding: 28px 24px 24px;
    position: relative;
  }

  .card::before {
    content: '■ PIXEL GEN v2.0 ■';
    position: absolute;
    top: -11px; left: 20px;
    background: var(--panel);
    padding: 0 8px;
    font-size: 7px;
    color: var(--border);
    letter-spacing: 1px;
  }

  .card::after {
    content: '';
    position: absolute;
    bottom: -2px; right: -2px;
    width: 14px; height: 14px;
    background: var(--accent);
  }

  .field-label {
    display: block;
    font-size: 8px;
    color: var(--accent2);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  textarea {
    width: 100%;
    height: 88px;
    background: #06060f;
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 12px;
    resize: none;
    outline: none;
    line-height: 1.9;
    transition: border-color .2s, box-shadow .2s;
  }

  textarea:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
  }

  textarea::placeholder { color: var(--dim); }

  .char-row {
    display: flex;
    justify-content: flex-end;
    margin: 5px 0 22px;
  }

  .char-count {
    font-size: 7px;
    color: var(--dim);
    transition: color .2s;
  }

  .char-count.warn { color: var(--accent); text-shadow: 0 0 6px var(--accent); }

  /* Style selector */
  .style-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }

  .style-btn {
    background: var(--btn-bg);
    border: 2px solid var(--border);
    color: var(--dim);
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 12px 6px 10px;
    cursor: pointer;
    text-align: center;
    line-height: 2;
    letter-spacing: .5px;
    transition: all .15s;
    user-select: none;
  }

  .style-btn .icon { display: block; font-size: 20px; margin-bottom: 6px; }
  .style-btn .name { display: block; color: inherit; }
  .style-btn .sub  { display: block; font-size: 6px; color: var(--dim); margin-top: 4px; opacity: .7; }

  .style-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
    box-shadow: 0 0 8px rgba(0,255,204,.4);
  }

  .style-btn.active {
    border-color: var(--accent2);
    background: rgba(0,255,204,.1);
    color: #fff;
    box-shadow: 0 0 12px rgba(0,255,204,.5);
  }

  .style-btn.active .sub { color: var(--accent2); opacity: 1; }

  /* Generate button */
  .gen-btn {
    width: 100%;
    background: var(--accent);
    border: 2px solid #ff6aaa;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 14px;
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    top: 0;
    box-shadow: 0 4px 0 #880033, 0 0 14px var(--accent);
    transition: all .12s;
  }

  .gen-btn:hover:not(:disabled) {
    top: -2px;
    box-shadow: 0 6px 0 #880033, 0 0 24px var(--accent);
  }

  .gen-btn:active:not(:disabled) {
    top: 4px;
    box-shadow: 0 0 0 #880033, 0 0 8px var(--accent);
  }

  .gen-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
    box-shadow: none;
    top: 0;
  }

  /* Output */
  .output {
    margin-top: 28px;
  }

  .status-msg {
    font-size: 8px;
    text-align: center;
    padding: 20px 8px;
    line-height: 2.2;
    color: var(--dim);
    letter-spacing: 1px;
  }

  .status-msg.loading {
    color: var(--accent2);
  }

  .status-msg.error {
    color: var(--accent);
  }

  .loading-bar {
    width: 100%;
    height: 8px;
    background: #06060f;
    border: 2px solid var(--border);
    margin-top: 12px;
    overflow: hidden;
    display: none;
  }

  .loading-bar.visible { display: block; }

  .loading-bar-inner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--border), var(--accent2));
    box-shadow: 0 0 8px var(--accent2);
    animation: loadprogress 60s linear forwards;
  }

  @keyframes loadprogress {
    0%   { width: 0%; }
    80%  { width: 88%; }
    100% { width: 95%; }
  }

  .img-frame {
    border: 2px solid var(--border);
    box-shadow: 0 0 16px rgba(58,58,255,.4);
    background: #06060f;
    overflow: hidden;
    image-rendering: pixelated;
  }

  .img-frame img {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .img-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }

  .img-actions button {
    background: var(--btn-bg);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    letter-spacing: .5px;
    transition: all .15s;
  }

  .img-actions button:hover {
    border-color: var(--accent2);
    color: var(--accent2);
    box-shadow: 0 0 8px rgba(0,255,204,.4);
  }

  .prompt-info {
    margin-top: 10px;
    font-size: 7px;
    color: var(--dim);
    line-height: 2.2;
    word-break: break-word;
  }

  .prompt-info span { color: var(--accent2); }

  footer {
    margin-top: 44px;
    font-size: 7px;
    color: var(--dim);
    text-align: center;
    line-height: 3;
    letter-spacing: .5px;
  }

  footer a { color: var(--border); text-decoration: none; }
  footer a:hover { color: var(--accent2); }
</style>
</head>
<body>

<header>
  <h1>🎮 PIXEL STYLE<br>IMAGE GENERATOR</h1>
  <p>▶ AI-POWERED · FREE · NO LOGIN REQUIRED ◀</p>
</header>

<div class="card">
  <label class="field-label" for="prompt">▸ DESCRIBE YOUR IMAGE</label>
  <textarea
    id="prompt"
    maxlength="200"
    placeholder="a knight fighting a dragon on top of a volcano..."
  ></textarea>
  <div class="char-row">
    <span class="char-count" id="charCount">0 / 200</span>
  </div>

  <label class="field-label">▸ CHOOSE STYLE</label>
  <div class="style-grid">
    <button class="style-btn active" data-style="pixel" onclick="selectStyle(this)">
      <span class="icon">👾</span>
      <span class="name">PIXEL ART</span>
      <span class="sub">16-bit retro</span>
    </button>
    <button class="style-btn" data-style="anime" onclick="selectStyle(this)">
      <span class="icon">✨</span>
      <span class="name">ANIME</span>
      <span class="sub">manga · cel shading</span>
    </button>
    <button class="style-btn" data-style="meme" onclick="selectStyle(this)">
      <span class="icon">😂</span>
      <span class="name">MEME</span>
      <span class="sub">internet humor</span>
    </button>
  </div>

  <button class="gen-btn" id="genBtn" onclick="generate()">▶ GENERATE IMAGE</button>

  <div class="output" id="output">
    <div class="status-msg">[ ENTER A PROMPT AND HIT GENERATE ]</div>
  </div>
</div>

<footer>
  POWERED BY <a href="https://pollinations.ai" target="_blank">POLLINATIONS.AI</a> · OPEN SOURCE · FREE FOREVER
</footer>

<script>
  const STYLE_MODIFIERS = {
    pixel: 'pixel art style, 16-bit, retro game',
    anime: 'anime style, manga, cel shading, vibrant colors',
    meme:  'meme format, internet humor, flat style'
  };

  let selectedStyle = 'pixel';
  let genTimeout = null;
  let currentUrl = '';

  // Live char counter
  const promptEl  = document.getElementById('prompt');
  const charCountEl = document.getElementById('charCount');

  promptEl.addEventListener('input', () => {
    const n = promptEl.value.length;
    charCountEl.textContent = `${n} / 200`;
    charCountEl.className = 'char-count' + (n > 170 ? ' warn' : '');
  });

  function selectStyle(btn) {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedStyle = btn.dataset.style;
  }

  function setOutput(html) {
    document.getElementById('output').innerHTML = html;
  }

  function generate() {
    const userText = promptEl.value.trim();
    if (!userText) {
      setOutput('<div class="status-msg error">⚠ PLEASE ENTER A PROMPT FIRST</div>');
      return;
    }

    // Build full prompt
    const fullPrompt = `${userText}, ${STYLE_MODIFIERS[selectedStyle]}`;
    const encoded    = encodeURIComponent(fullPrompt);
    const seed       = Math.floor(Math.random() * 999999);
    const imgUrl     = `https://image.pollinations.ai/prompt/${encoded}?width=512&height=512&nologo=true&seed=${seed}`;
    currentUrl       = imgUrl;

    // Disable button, show loading
    const genBtn = document.getElementById('genBtn');
    genBtn.disabled = true;

    setOutput(`
      <div class="status-msg loading">▓▒░ GENERATING… THIS MAY TAKE UP TO 60s ░▒▓</div>
      <div class="loading-bar visible"><div class="loading-bar-inner" id="loadBar"></div></div>
    `);

    // 15-second timeout guard
    genTimeout = setTimeout(() => {
      genBtn.disabled = false;
      setOutput('<div class="status-msg error">✖ TIMEOUT: POLLINATIONS.AI IS TAKING TOO LONG.<br>SERVER MAY BE BUSY — PLEASE WAIT A MOMENT AND TRY AGAIN.</div>');
    }, 60000);

    const img = new Image();

    img.onload = () => {
      clearTimeout(genTimeout);
      genBtn.disabled = false;
      renderResult(imgUrl, userText);
    };

    img.onerror = () => {
      clearTimeout(genTimeout);
      genBtn.disabled = false;
      setOutput('<div class="status-msg error">✖ GENERATION FAILED. POLLINATIONS.AI MAY BE UNDER LOAD.<br>WAIT 5-10 SECONDS AND RETRY.</div>');
    };

    img.src = imgUrl;
  }

  function renderResult(imgUrl, promptText) {
    setOutput(`
      <div class="img-frame">
        <img src="${imgUrl}" alt="Generated image" id="genImg" />
      </div>
      <div class="img-actions">
        <button onclick="downloadImage()">⬇ DOWNLOAD PNG</button>
        <button onclick="generate()">↺ REGENERATE</button>
      </div>
      <div class="prompt-info">
        ▸ PROMPT: <span>${esc(promptText)}</span><br>
        ▸ STYLE: <span>${selectedStyle.toUpperCase()}</span>
      </div>
    `);
  }

  function downloadImage() {
    // Fetch through a canvas to force download
    const imgEl = document.getElementById('genImg');
    if (!imgEl) return;

    fetch(imgEl.src)
      .then(r => r.blob())
      .then(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'generated-image.png';
        a.click();
        URL.revokeObjectURL(a.href);
      })
      .catch(() => {
        // Fallback: open in new tab
        window.open(imgEl.src, '_blank');
      });
  }

  function esc(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
